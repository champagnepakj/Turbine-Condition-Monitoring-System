apiVersion: apps/v1
kind: Deployment
metadata:
  name: timescaledb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: timescaledb
  template:
    metadata:
      labels:
        app: timescaledb
    spec:
      containers:
        - name: timescaledb
          image: timescale/timescaledb:latest-pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "vib"
            - name: POSTGRES_PASSWORD
              value: "vib"
            - name: POSTGRES_DB
              value: "vib"
          volumeMounts:
            - name: timescale-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: timescale-storage
          persistentVolumeClaim:
            claimName: timescaledb-pvc
