name: CI

on:
  push:
    branches: [main]
  pull request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install numpy scipy matplotlib pytest
      - run: pytest python/tests/ -v
